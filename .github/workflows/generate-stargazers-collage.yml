name: Generate Stargazers Collage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      COLS: 8
      TILE: 80
      GAP: 8
      MAX_STARGAZERS: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq imagemagick

      - name: Fetch stargazers & download avatars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/avatars
        
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
        
          PAGE=1
          INDEX=0
        
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Warning: GH_TOKEN is empty. Requests will be unauthenticated and heavily rate-limited."
          fi
        
          # 循环分页获取 stargazers（每页 100），最多 MAX_STARGAZERS 个
          while [ "$INDEX" -lt "$MAX_STARGAZERS" ]; do
            URL="https://api.github.com/repos/${OWNER}/${REPO}/stargazers?per_page=100&page=${PAGE}"
            # 构建头部
            HDRS=(-H "Accept: application/vnd.github.star+json" -H "X-GitHub-Api-Version: 2022-11-28")
            if [ -n "${GH_TOKEN:-}" ]; then
              HDRS+=(-H "Authorization: Bearer ${GH_TOKEN}")
            fi
        
            # 发起请求，捕获 body 并在末尾追加 http code
            HTTP_OUTPUT=$(curl -sS "${HDRS[@]}" -w "\n%{http_code}" "$URL" || true)
            HTTP_STATUS=$(echo "$HTTP_OUTPUT" | tail -n1)
            RESPONSE=$(echo "$HTTP_OUTPUT" | sed '$d')
        
            if [ -z "$HTTP_STATUS" ]; then
              echo "Failed to contact GitHub API (curl network error). Retrying..."
              sleep 5
              continue
            fi
        
            # 处理常见状态码
            if [ "$HTTP_STATUS" -ge 500 ]; then
              echo "GitHub API server error (HTTP $HTTP_STATUS). Backing off and retrying..."
              sleep 5
              continue
            fi
        
            if [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 403 ]; then
              echo "GitHub API returned HTTP $HTTP_STATUS. Possible authentication/permission/rate-limit issue."
              echo "Response body (truncated):"
              echo "$RESPONSE" | jq -C '.' || echo "$RESPONSE"
              echo "Aborting to avoid repeated failures — check GH_TOKEN and token permissions or rate limits."
              exit 1
            fi
        
            if [ "$HTTP_STATUS" -eq 404 ]; then
              echo "Repository not found (HTTP 404): ${OWNER}/${REPO}. Aborting."
              exit 1
            fi
        
            # 解析结果数量；jq 出错时返回 0
            COUNT=$(echo "$RESPONSE" | jq 'length' 2>/dev/null || echo "0")
            if [ "$COUNT" -eq 0 ]; then
              break
            fi
        
            SORTED=$(echo "$RESPONSE" | jq -r 'sort_by(.starred_at) | reverse | .[].user.avatar_url')
            for AVATAR_URL in $SORTED; do
              if [ "$INDEX" -ge "$MAX_STARGAZERS" ]; then
                break
              fi
              PADDED=$(printf "%04d" "$INDEX")
              # 下载头像，单张失败不影响整体（保留 || true）
              curl -sfL "${AVATAR_URL}&s=${TILE}" -o "/tmp/avatars/${PADDED}.png" || true
              INDEX=$((INDEX + 1))
            done
        
            PAGE=$((PAGE + 1))
          done
        
          echo "Downloaded $INDEX avatars"

      - name: Generate collage with ImageMagick
        run: |
          set -euo pipefail

          if command -v magick >/dev/null 2>&1; then
            IM="magick"
          elif command -v convert >/dev/null 2>&1; then
            IM="convert"
          else
            echo "ImageMagick command not found"
            exit 1
          fi

          FILES=(/tmp/avatars/*.png)
          COUNT=${#FILES[@]}

          if [ "$COUNT" -eq 0 ]; then
            echo "No avatars found, skipping."
            exit 0
          fi

          # 将每张头像裁成圆形（透明背景 + 抗锯齿）
          mkdir -p /tmp/circles
          for f in "${FILES[@]}"; do
            NAME=$(basename "$f")
            # 4x 超采样圆形遮罩
            BIG=$((TILE * 4))
            "$IM" -size "${BIG}x${BIG}" xc:none \
              -fill white -draw "circle $((BIG/2)),$((BIG/2)) $((BIG/2)),0" \
              -resize "${TILE}x${TILE}" \
              /tmp/circle_mask.png

            "$IM" "$f" -resize "${TILE}x${TILE}^" -gravity center -extent "${TILE}x${TILE}" \
              /tmp/circle_mask.png -compose CopyOpacity -composite \
              "/tmp/circles/${NAME}"
          done

          # 使用 montage 或 magick montage 拼成网格，透明背景
          ROWS=$(( (COUNT + COLS - 1) / COLS ))

          if command -v magick >/dev/null 2>&1; then
            MONTAGE=(magick montage)
          elif command -v montage >/dev/null 2>&1; then
            MONTAGE=(montage)
          else
            echo "montage command not found"
            exit 1
          fi

          "${MONTAGE[@]}" /tmp/circles/*.png \
            -tile "${COLS}x" \
            -geometry "${TILE}x${TILE}+${GAP}+${GAP}" \
            -background none \
            images/stargazers.png

          if [ ! -f images/stargazers.png ]; then
            echo "images/stargazers.png was not generated"
            ls -la
            ls -la images || true
            exit 1
          fi

          echo "Generated file details:"
          ls -lh images/stargazers.png

          echo "Generated collage: ${COLS} cols, ${ROWS} rows, ${COUNT} avatars"

      - name: Commit and push if changed
        run: |
          echo "Git status before commit:"
          git status --short

          if [ ! -f images/stargazers.png ]; then
            echo "images/stargazers.png does not exist, aborting commit step"
            exit 1
          fi

          if [ -z "$(git status --porcelain -- images/stargazers.png)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/stargazers.png
          git commit -m "chore: update stargazers collage"
          git push
